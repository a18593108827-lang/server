server:
  port: 8080

spring:
  application:
    name: mes-server
  profiles:
    active: dev

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Sa-Token 鉴权配置
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

# MES 业务配置
mes:
  dispatch:
    # 设备预约超时（分钟），默认 30
    reserve-ttl-minutes: 30
  recipe:
    # true=TrackIn 强制要求配方绑定解析成功；默认 false
    require-binding: false
